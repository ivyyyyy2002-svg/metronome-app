name: metronome_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  just_audio: ^0.10.5          
  audio_session: ^0.2.2   
  audioplayers: ^6.5.1     
  flutter_midi_pro: ^3.1.6
  shared_preferences: ^2.5.3
  
  # UI
  cupertino_icons: ^1.0.8
  pdfx: ^2.9.2
  file_picker: ^11.0.2
  image_picker: ^1.2.1
  # Apple-style liquid glass (shader-based, Impeller only, experimental)
  liquid_glass_renderer: ^0.2.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - web/icons/Icon-192.png
    - assets/config/
    - assets/sounds/
    - assets/sounds/metronome_clicks/
    - assets/notes/piano/
    - assets/notes/harmonium/
    - assets/notes/guzheng/

    - assets/sf2/
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Celesta.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Harp.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Clarinet.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Oboe.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Trumpet.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/French Horn 1.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Acoustic Gtr.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/El Guitar 1.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Acoustic Bass.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Bianzhong.sf2
    - assets/sf2/EMU_Liveware_ESC_SoundFont_Library_SF2/Marimba.sf2
